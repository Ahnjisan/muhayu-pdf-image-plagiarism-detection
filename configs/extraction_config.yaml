paths:
  pdf_root: test_data_set/Origin
  output_root: test_data_set/Extracted

publaynet:
  config_path: configs/layoutparser_config.yaml
  model_path: model.pth
  device: cuda:0
  score_threshold: 0.8
  dpi: 300
  label_map:
    0: Text
    1: Title
    2: List
    3: Table
    4: Figure

target_labels:
  - Figure
